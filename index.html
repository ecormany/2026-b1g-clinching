<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B1G Championship Scenarios – 2026 Week 13</title>
  <meta name="description" content="Every way the final week can set the 2026 Big Ten Football Championship Game, drawn as one branching tree." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>B1G Championship Scenarios – 2026 Week 13</h1>
    </header>

    <h2 class="label">Pick a team to see their paths</h2>
    <section class="teams" id="teams" aria-label="Chances to reach the title game"></section>

    <h2 class="label">Or pick games to see who's left</h2>
    <section class="controls" aria-label="Pick game winners">
      <div class="games" id="games"></div>
      <div class="presets">
        <button class="reset" id="reset" type="button">Clear all picks</button>
      </div>
    </section>

    <section class="treebox" aria-label="Tree of possible outcomes">
      <div class="treehead">
        <span class="treehead-label" id="orderLabel">Order games by</span>
        <div class="seg" role="group" aria-labelledby="orderLabel">
          <button type="button" data-order="decisive" aria-pressed="true">Most decisive first</button>
          <button type="button" data-order="time" aria-pressed="false">Kickoff time</button>
        </div>
      </div>
      <p class="sentence" id="sentence" aria-live="polite"></p>
      <div class="scroller"><svg id="tree" role="img" aria-label="Branching tree of title game outcomes"></svg></div>
    </section>

    <section class="result" id="result" hidden></section>

    <footer class="foot">
      <p>Scenarios: <a href="https://bigten.org/news/2026/11/23/2026-discover-big-ten-football-championship-game-clinch-update.aspx" target="_blank" rel="noopener">Big Ten clinch update, Nov. 23, 2026</a> and <a href="https://bigten.org/sports/2026/11/10/FB_1110261447.aspx" target="_blank" rel="noopener">Big Ten tiebreaker rules</a>. Lines: ESPN. Win chance ≈ Φ(spread ÷ 13.5). Not affiliated with the Big Ten Conference.</p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
