<!doctype html>
<!-- Builds og.png (the 1200×630 social image) from the live tree.
     With `npm run dev` running: npm run og -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f0f8fd; font-family: Inter, system-ui, sans-serif; color: #17181c; position: relative; }
  .text { position: absolute; left: 64px; top: 64px; width: 420px; }
  .kicker { display: inline-block; background: #0088ce; color: #fff; font-weight: 700; font-size: 22px; letter-spacing: .02em; padding: 8px 16px; border-radius: 999px; }
  h1 { margin: 28px 0 0; font-size: 54px; line-height: 1; font-weight: 900; letter-spacing: -.035em; }
  .tree { position: absolute; left: 470px; top: 40px; width: 700px; height: 550px; background: #fff; border-radius: 28px; box-shadow: 0 2px 0 #e8e4db, 0 12px 40px rgba(0, 60, 100, .08); overflow: hidden; }
  .tree svg { display: block; width: 100%; height: 100%; }
  iframe { position: absolute; left: -5000px; width: 860px; height: 2400px; border: 0; }
</style>
</head>
<body>
  <div class="text">
    <span class="kicker">2026 · Week 13</span>
    <h1>B1G Championship Scenarios</h1>
  </div>
  <div class="tree" id="tree"></div>
  <iframe id="src" src="../index.html#v=pre"></iframe>
<script>
const f = document.getElementById("src");
f.onload = () => setTimeout(() => {
  const d = f.contentDocument, orig = d.querySelector(".treebox svg");
  const s = orig.cloneNode(true), oe = [...orig.querySelectorAll("*")], ce = [...s.querySelectorAll("*")];
  ce.forEach((el, i) => {
    if (!["path", "rect"].includes(el.tagName)) return;
    const cs = f.contentWindow.getComputedStyle(oe[i]);
    for (const k of ["fill", "stroke", "opacity"]) el.setAttribute(k, cs[k]);
    el.setAttribute("stroke-width", cs.strokeWidth);
    el.removeAttribute("class"); el.removeAttribute("style");
  });
  s.querySelectorAll("text, line").forEach((t) => t.remove());
  // Fit the whole tree (shapes only), with a margin.
  const bb = [...orig.querySelectorAll("path")].filter((e) => !e.closest("defs")).map((e) => e.getBBox()).filter((r) => r.width || r.height);
  const x0 = Math.min(...bb.map((r) => r.x)), y0 = Math.min(...bb.map((r) => r.y));
  const x1 = Math.max(...bb.map((r) => r.x + r.width)), y1 = Math.max(...bb.map((r) => r.y + r.height));
  const m = 28;
  s.setAttribute("viewBox", `${x0 - m} ${y0 - m} ${x1 - x0 + 2 * m} ${y1 - y0 + 2 * m}`);
  s.setAttribute("preserveAspectRatio", "xMidYMid meet");
  s.removeAttribute("width"); s.removeAttribute("height");
  document.getElementById("tree").append(s);
  f.remove();
  document.body.dataset.ready = "1";
}, 1500);
</script>
</body>
</html>
